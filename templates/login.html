<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeitsteuerung entsperren</title>
  <link rel="stylesheet" href="/static/bootstrap.5.1.3.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-3 text-center">PIN eingeben</h1>
            <p class="text-muted text-center mb-4">
              Zeitsteuerung für Timekpr-nExT entsperren
            </p>

            {% if error %}
              <div class="alert alert-danger" role="alert">
                {{ error }}
              </div>
            {% endif %}

            <form method="post">
              <div class="mb-3">
                <label for="pin" class="form-label">PIN</label>
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="pin"
                  name="pin"
                  inputmode="numeric"
                  autocomplete="current-password"
                  autofocus
                  required
                >
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                  Entsperren
                </button>
              </div>
            </form>
          </div>
        </div>

        <p class="text-center text-muted mt-3 small">
          Nur im Heimnetz verwenden.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
